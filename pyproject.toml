[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pa0-vision-experiments"
version = "0.3.0"
description = "PA0 experiments on ResNet-152, Vision Transformers, and VAEs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
  "transformers>=4.44,<6",
]

[project.scripts]
resnet152-pa0 = "resnet152_pa0.cli:main"
vit-pa0 = "vit_pa0.cli:main"
vae-pa0 = "vae_pa0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
